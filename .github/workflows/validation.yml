name: Platform Validation

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Helm golden path
        run: |
          helm lint helm/golden-path
          helm template golden-path helm/golden-path > /tmp/golden-path.yaml
          grep -q "kind: Deployment" /tmp/golden-path.yaml
          grep -q "kind: Service" /tmp/golden-path.yaml

      - name: Validate Kubernetes guardrails
        run: |
          grep -q "kind: NetworkPolicy" kubernetes/network-policy.yaml
          grep -q "kind: ResourceQuota" kubernetes/resource-quota.yaml
          grep -q "resources:" kubernetes/golden-path-app.yaml

      - name: Validate GitOps promotion contract
        run: |
          test -f gitops/environments/dev/values.yaml
          test -f gitops/environments/staging/values.yaml
          test -f gitops/environments/production/values.yaml
          grep -q "tag: stable" gitops/environments/production/values.yaml

      - name: Validate policy, reliability and FinOps controls
        run: |
          grep -q "validationFailureAction: Enforce" policies/kyverno/require-workload-guardrails.yaml
          grep -q "99.9" observability/service-level-objectives.yaml
          grep -q "cost-center" finops/guardrails.yaml
          test -f docs/threat-model.md
          test -f docs/adr/0001-gitops-as-deployment-authority.md
          test -f runbooks/deployment-failure.md
