replicaCount: 2
image:
  repository: ghcr.io/alexcgodwin/golden-path-api
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
